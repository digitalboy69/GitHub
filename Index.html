<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitPilot — GitHub Command Center</title>
<style>
:root{--bg:#090B10;--side:#0D1017;--card:#121722;--elev:#181F2C;--p:#7C5CFC;--s:#4F8CFF;--ok:#32D583;--warn:#F5B942;--bad:#F97066;--tx:#F4F6FC;--tx2:#9BA7BA;--bd:#273143;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:root[data-t=light]{--bg:#F6F7FB;--side:#fff;--card:#fff;--elev:#EEF1F8;--tx:#10131C;--tx2:#5B677C;--bd:#DCE1EC}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,Geist,system-ui,sans-serif}
a{color:var(--s)}button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--elev);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:34px}
button:hover{border-color:var(--p)}button.pri{background:var(--p);border-color:var(--p);color:#fff}button.dan{color:var(--bad)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
textarea{font-family:var(--mono);font-size:13px;min-height:320px;resize:vertical;tab-size:2}
#app{display:flex;min-height:100vh}
aside{width:224px;background:var(--side);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;flex-shrink:0;transition:transform .2s;z-index:20}
aside h1{font-size:17px;margin:4px 8px 14px;background:linear-gradient(90deg,var(--p),var(--s));-webkit-background-clip:text;color:transparent}
.nav{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx2);padding:9px 10px;margin:2px 0}
.nav.on,.nav:hover{background:var(--elev);color:var(--tx)}
main{flex:1;min-width:0}header{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:10}
header .sp{flex:1}#menu{display:none}.av{width:26px;height:26px;border-radius:50%;vertical-align:middle}
#main{padding:18px;max-width:1200px}
h2{margin:0 0 12px;font-size:20px}h3{margin:16px 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.m{font-size:26px;font-weight:650}.dim{color:var(--tx2);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>input,.row>select{flex:1;min-width:130px;width:auto}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer}
.item:hover{background:var(--elev)}.item .g{flex:1;min-width:0}.item b{word-break:break-word}
.list{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.tag{font-size:11px;border:1px solid var(--bd);border-radius:99px;padding:1px 8px;color:var(--tx2)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd);margin:10px 0}
.tabs button{border:0;background:none;border-radius:0;color:var(--tx2);white-space:nowrap}.tabs button.on{color:var(--tx);border-bottom:2px solid var(--p)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow:auto;font:12px var(--mono);max-height:420px}
.add{color:var(--ok)}.del{color:var(--bad)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;width:min(520px,94vw);padding:18px}
dialog::backdrop{background:#0009}label{display:block;margin:10px 0 4px;font-size:12.5px;color:var(--tx2)}
#toast{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
#toast div{background:var(--elev);border:1px solid var(--bd);border-left:3px solid var(--p);padding:10px 14px;border-radius:8px;max-width:340px}
.bar{height:8px;border-radius:4px;display:flex;overflow:hidden;background:var(--elev)}
.sk{height:60px;border-radius:10px;background:linear-gradient(90deg,var(--card),var(--elev),var(--card));background-size:200%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200%}}
#conn{max-width:440px;margin:8vh auto;padding:0 16px}
.scroll{overflow-x:auto}
@media(max-width:800px){aside{position:fixed;transform:translateX(-100%)}aside.open{transform:none}#menu{display:inline-block}#main{padding:12px}}
</style></head>
<body>
<div id="app"></div><div id="toast"></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={token:null,user:null,repo:null,branch:null,tab:'files',path:'',view:'dash'},R=[],cache={};
const ago=d=>{if(!d)return'—';const s=(Date.now()-new Date(d))/1e3;return s<3600?Math.max(1,s/60|0)+'m ago':s<86400?(s/3600|0)+'h ago':(s/86400|0)+'d ago'};
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.style.borderLeftColor='var(--bad)';$('#toast').append(d);setTimeout(()=>d.remove(),5000)}
async function gh(p,o={}){
  const r=await fetch(p.startsWith('http')?p:'https://api.github.com'+p,{...o,headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+S.token,...(o.body?{'Content-Type':'application/json'}:{})},body:o.body?JSON.stringify(o.body):undefined});
  if(r.status==204)return null;
  const t=await r.text();let j;try{j=JSON.parse(t)}catch{j=t}
  if(!r.ok){const m=j?.message||r.statusText;
    throw new Error(r.status==401?'Token invalid, expired or revoked.':r.status==403?(r.headers.get('x-ratelimit-remaining')=='0'?'Rate limit hit — resets '+new Date(r.headers.get('x-ratelimit-reset')*1e3).toLocaleTimeString():'Forbidden: token lacks permission. '+m):r.status==404?'Not found, or your token cannot see it. '+m:r.status==409?'Conflict — the file/branch changed on GitHub. Reload and retry. '+m:r.status==422?'Rejected by GitHub: '+m+(j.errors?' '+JSON.stringify(j.errors):''):m)}
  return j}
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const enc=t=>{let b=new TextEncoder().encode(t),s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(s)};
function form(title,fields,cb,ok='Submit'){
  const d=$('#dlg');d.innerHTML=`<form method="dialog"><h3 style="margin-top:0">${title}</h3>${fields.map(f=>`<label>${f.l}</label>`+(f.t=='select'?`<select name="${f.n}">${f.o.map(o=>`<option ${o==f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:f.t=='area'?`<textarea name="${f.n}" style="min-height:120px">${esc(f.v||'')}</textarea>`:f.t=='check'?`<input type="checkbox" name="${f.n}" style="width:auto" ${f.v?'checked':''}>`:`<input name="${f.n}" value="${esc(f.v||'')}" placeholder="${esc(f.p||'')}">`)).join('')}<div class="row" style="justify-content:flex-end;margin-top:16px"><button value="x">Cancel</button><button class="pri" id="ok">${ok}</button></div></form>`;
  d.showModal();
  d.querySelector('#ok').onclick=async e=>{e.preventDefault();const v={};d.querySelectorAll('[name]').forEach(i=>v[i.name]=i.type=='checkbox'?i.checked:i.value.trim());
    try{await cb(v);d.close()}catch(x){toast(x.message,1)}}}
const confirmD=(msg,fn)=>form('Confirm',[{l:msg,t:'x',n:'_',v:''}].slice(0,0),fn,'Confirm')||($('#dlg form').insertAdjacentHTML('afterbegin','')||$('#dlg h3').insertAdjacentHTML('afterend',`<p>${msg}</p>`));
function head(){return `<aside id="sb"><h1>🧭 GitPilot</h1>${[['dash','🏠 Dashboard'],['repos','📦 Repositories'],['notes','🔔 Notifications']].map(([k,l])=>`<button class="nav ${S.view==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}<div class="dim" style="position:absolute;bottom:14px;left:16px;right:10px">Dev mode: token held in memory only. Disconnect clears it; revoke at GitHub settings to invalidate.</div></aside>`}
function shell(){$('#app').innerHTML=head()+`<main><header><button id="menu" onclick="$('#sb').classList.toggle('open')">☰</button><span class="sp"></span><button onclick="document.documentElement.dataset.t=document.documentElement.dataset.t=='light'?'':'light'">◐</button><img class="av" src="${S.user.avatar_url}"> <b>${esc(S.user.login)}</b><button onclick="disc()">Disconnect</button></header><div id="main"></div></main>`}
function connect(){$('#app').innerHTML=`<div id="conn"><h1 style="font-size:30px;margin-bottom:4px">🧭 GitPilot</h1><p class="dim">Your entire GitHub universe. One command center.</p><div class="card"><label>Personal Access Token</label><div class="row"><input id="tk" type="password" placeholder="github_pat_… or ghp_…" autocomplete="off"><button onclick="tk.type=tk.type=='password'?'text':'password'">👁</button></div><button class="pri" style="width:100%" onclick="doConnect()">Connect</button><p class="dim">Your token stays in this tab's memory and is sent only to api.github.com. Nothing is saved or logged. <b>Development-only auth mode</b> — a production build should use a backend session or OAuth/GitHub App flow.</p><p class="dim">Create one at <a target="_blank" rel="noopener" href="https://github.com/settings/personal-access-tokens/new">GitHub settings</a>. Read-only views need read scopes; editing needs Contents/Issues/Pull requests/Actions write. Classic tokens: <code>repo</code>, <code>workflow</code>, <code>notifications</code>.</p></div></div>`}
async function doConnect(){S.token=$('#tk').value.trim();try{S.user=await gh('/user');shell();go('dash')}catch(e){S.token=null;toast(e.message,1)}}
function disc(){S={token:null,user:null,repo:null,branch:null,tab:'files',path:'',view:'dash'};R=[];cache={};connect()}
function go(v){S.view=v;S.repo=null;shell();$('#main').innerHTML='<div class="sk"></div>';({dash,repos,notes})[v]()}
const main=h=>$('#main').innerHTML=h,err=e=>main(`<div class="card bad">⚠ ${esc(e.message)}</div>`);
async function load(){if(!R.length)R=await gh('/user/repos?per_page=100&sort=pushed&affiliation=owner,collaborator,organization_member');return R}
async function dash(){try{const r=await load(),own=r.filter(x=>x.owner.login==S.user.login),L={};r.forEach(x=>x.language&&(L[x.language]=(L[x.language]||0)+1));
  const tot=Object.values(L).reduce((a,b)=>a+b,0),cols=['#7C5CFC','#4F8CFF','#32D583','#F5B942','#F97066','#9BA7BA'];
  main(`<h2>Welcome, ${esc(S.user.name||S.user.login)} 👋</h2><div class="dim">Connected as ${esc(S.user.login)} · synced ${new Date().toLocaleTimeString()}</div>
  <div class="row"><button class="pri" onclick="newRepo()">＋ New repository</button><button onclick="go('repos')">Browse repositories</button></div>
  <div class="grid" style="margin:12px 0">${[['Accessible repos',r.length],['Owned',own.length],['Stars (loaded repos)',r.reduce((a,x)=>a+x.stargazers_count,0)],['Open issues + PRs',r.reduce((a,x)=>a+x.open_issues_count,0)]].map(([a,b])=>`<div class="card"><div class="dim">${a}</div><div class="m">${b}</div></div>`).join('')}</div>
  <div class="dim">Metrics cover the first 100 repos GitHub returned. GitHub counts PRs inside "open issues".</div>
  <h3>Languages</h3><div class="card"><div class="bar">${Object.entries(L).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v],i)=>`<div title="${k}" style="width:${v/tot*100}%;background:${cols[i]}"></div>`).join('')}</div><div class="dim" style="margin-top:6px">${Object.entries(L).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>k+' '+v).join(' · ')||'No language data'}</div></div>
  <h3>Recently pushed</h3><div class="list">${r.slice(0,8).map(x=>repoRow(x)).join('')}</div>`)}catch(e){err(e)}}
const repoRow=x=>`<div class="item" onclick="openRepo('${x.full_name}')"><div class="g"><b>${esc(x.full_name)}</b> <span class="tag">${x.private?'private':'public'}</span> ${x.archived?'<span class="tag warn">archived</span>':''}<div class="dim">${esc(x.description||'')}</div></div><div class="dim">${x.language||''} ★${x.stargazers_count} · ${ago(x.pushed_at)}</div></div>`;
function repos(){load().then(()=>{main(`<h2>Repositories</h2><div class="row"><input id="q" placeholder="Search name or description" oninput="rl()"><select id="vi" onchange="rl()"><option value="">All</option><option>public</option><option>private</option></select><select id="ow" onchange="rl()"><option value="">All owners</option>${[...new Set(R.map(x=>x.owner.login))].map(o=>`<option>${o}</option>`).join('')}</select><select id="lg" onchange="rl()"><option value="">All languages</option>${[...new Set(R.map(x=>x.language).filter(Boolean))].map(o=>`<option>${o}</option>`).join('')}</select><select id="so" onchange="rl()"><option value="pushed_at">Recently pushed</option><option value="name">Name</option><option value="stargazers_count">Stars</option><option value="created_at">Created</option></select><button class="pri" onclick="newRepo()">＋ New</button></div><div class="list" id="rl"></div>`);rl()}).catch(err)}
function rl(){const q=$('#q').value.toLowerCase(),v=$('#vi').value,o=$('#ow').value,l=$('#lg').value,s=$('#so').value;
  const a=R.filter(x=>(!q||(x.name+(x.description||'')).toLowerCase().includes(q))&&(!v||(x.private?'private':'public')==v)&&(!o||x.owner.login==o)&&(!l||x.language==l)).sort((a,b)=>s=='name'?a.name.localeCompare(b.name):s=='stargazers_count'?b[s]-a[s]:new Date(b[s])-new Date(a[s]));
  $('#rl').innerHTML=a.map(repoRow).join('')||'<div class="item dim">No matches</div>'}
function newRepo(){form('New repository',[{l:'Name',n:'name'},{l:'Description',n:'description'},{l:'Visibility',n:'vis',t:'select',o:['public','private']},{l:'Initialize with README',n:'auto',t:'check',v:1},{l:'.gitignore template (e.g. Node)',n:'gi'},{l:'License key (e.g. mit)',n:'li'}],async v=>{
  if(!/^[\w.-]+$/.test(v.name))throw Error('Name may only contain letters, numbers, - _ .');
  const r=await gh('/user/repos',{method:'POST',body:{name:v.name,description:v.description,private:v.vis=='private',auto_init:v.auto,gitignore_template:v.gi||undefined,license_template:v.li||undefined}});R=[];toast('Created '+r.full_name);openRepo(r.full_name)},'Create')}
async function openRepo(fn){S.view='repos';shell();try{const r=await gh('/repos/'+fn);S.repo=r;S.branch=r.default_branch;S.tab='files';S.path='';rv()}catch(e){err(e)}}
const tabs=['files','branches','commits','issues','pulls','actions','releases'];
function rv(){const r=S.repo;main(`<h2>${esc(r.full_name)} <span class="tag">${r.private?'private':'public'}</span></h2><div class="dim">${esc(r.description||'')}</div><div class="row"><a href="${r.html_url}" target="_blank" rel="noopener">Open on GitHub ↗</a><button onclick="star()">★ Star</button><button onclick="arch()">${r.archived?'Unarchive':'Archive'}</button><button onclick="go('repos')">← All repos</button></div><div class="tabs">${tabs.map(t=>`<button class="${S.tab==t?'on':''}" onclick="S.tab='${t}';rv()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><div id="tb"><div class="sk"></div></div>`);T[S.tab]().catch(e=>$('#tb').innerHTML=`<div class="card bad">⚠ ${esc(e.message)}</div>`)}
const rp=()=>'/repos/'+S.repo.full_name;
async function star(){try{await gh('/user/starred/'+S.repo.full_name,{method:'PUT'});toast('Starred')}catch(e){toast(e.message,1)}}
function arch(){const a=!S.repo.archived;confirmD(`${a?'Archive':'Unarchive'} <b>${S.repo.full_name}</b>? ${a?'It becomes read-only.':''}`,async()=>{S.repo=await gh(rp(),{method:'PATCH',body:{archived:a}});toast('Updated');rv()})}
const brSel=async()=>{const b=await gh(rp()+'/branches?per_page=100');cache.br=b;return `<select id="bs" onchange="S.branch=this.value;S.path='';T.files()">${b.map(x=>`<option ${x.name==S.branch?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`};
const T={
async files(){const sel=await brSel(),c=await gh(`${rp()}/contents/${S.path}?ref=${encodeURIComponent(S.branch)}`);
  if(!Array.isArray(c))return openFile(c);
  c.sort((a,b)=>(a.type=='dir'?0:1)-(b.type=='dir'?0:1)||a.name.localeCompare(b.name));cache.f=c;
  $('#tb').innerHTML=`<div class="row">${sel}<span class="dim">/${esc(S.path)}</span>${S.path?`<button onclick="S.path=S.path.split('/').slice(0,-1).join('/');T.files()">↑ Up</button>`:''}<button onclick="T.files()">⟳</button><button class="pri" onclick="newFile()">＋ File</button></div><div class="list">${c.map((f,i)=>`<div class="item" onclick="nav(${i})"><span>${f.type=='dir'?'📁':'📄'}</span><div class="g">${esc(f.name)}</div><span class="dim">${f.type=='file'?(f.size/1024).toFixed(1)+' KB':''}</span></div>`).join('')}</div>`},
async branches(){const b=await gh(rp()+'/branches?per_page=100');cache.br=b;$('#tb').innerHTML=`<div class="row"><button class="pri" onclick="newBranch()">＋ Branch</button></div><div class="list">${b.map((x,i)=>`<div class="item"><div class="g"><b>${esc(x.name)}</b> ${x.name==S.repo.default_branch?'<span class="tag ok">default</span>':''} ${x.protected?'<span class="tag warn">protected</span>':''}<div class="dim">${x.commit.sha.slice(0,7)}</div></div><button onclick="cmp('${esc(x.name)}')">Compare</button><button class="dan" onclick="delBranch(${i})">Delete</button></div>`).join('')}</div><div id="cmp"></div>`},
async commits(){const c=await gh(`${rp()}/commits?sha=${encodeURIComponent(S.branch)}&per_page=30`);cache.c=c;$('#tb').innerHTML=`<div class="list">${c.map((x,i)=>`<div class="item" onclick="commit('${x.sha}')"><div class="g"><b>${esc(x.commit.message.split('\n')[0])}</b><div class="dim">${esc(x.commit.author.name)} · ${ago(x.commit.author.date)}</div></div><code>${x.sha.slice(0,7)}</code></div>`).join('')}</div><div id="cd"></div>`},
async issues(){const st=cache.ist||'open',i=(await gh(`${rp()}/issues?state=${st}&per_page=50`)).filter(x=>!x.pull_request);cache.i=i;$('#tb').innerHTML=`<div class="row"><select onchange="cache.ist=this.value;T.issues()">${['open','closed','all'].map(s=>`<option ${s==st?'selected':''}>${s}</option>`).join('')}</select><button class="pri" onclick="newIssue()">＋ Issue</button></div><div class="list">${i.map((x,k)=>`<div class="item" onclick="issue(${k})"><div class="g"><b>#${x.number} ${esc(x.title)}</b><div class="dim">${esc(x.user.login)} · ${ago(x.updated_at)} ${x.labels.map(l=>`<span class="tag">${esc(l.name)}</span>`).join(' ')}</div></div><span class="${x.state=='open'?'ok':'bad'}">${x.state}</span></div>`).join('')||'<div class="item dim">No issues</div>'}</div><div id="id"></div>`},
async pulls(){const st=cache.pst||'open',p=await gh(`${rp()}/pulls?state=${st}&per_page=50`);cache.p=p;$('#tb').innerHTML=`<div class="row"><select onchange="cache.pst=this.value;T.pulls()">${['open','closed','all'].map(s=>`<option ${s==st?'selected':''}>${s}</option>`).join('')}</select><button class="pri" onclick="newPR()">＋ Pull request</button></div><div class="list">${p.map((x,k)=>`<div class="item" onclick="pr(${k})"><div class="g"><b>#${x.number} ${esc(x.title)}</b><div class="dim">${esc(x.head.ref)} → ${esc(x.base.ref)} · ${esc(x.user.login)}</div></div><span class="${x.merged_at?'ok':x.state=='open'?'ok':'bad'}">${x.merged_at?'merged':x.state}</span></div>`).join('')||'<div class="item dim">None</div>'}</div><div id="pd"></div>`},
async actions(){const w=(await gh(rp()+'/actions/runs?per_page=30')).workflow_runs;cache.w=w;$('#tb').innerHTML=`<div class="list scroll">${w.map((x,k)=>`<div class="item" style="cursor:default"><div class="g"><b>${esc(x.name)}</b> <span class="dim">#${x.run_number} · ${esc(x.head_branch)} · ${x.event} · ${esc(x.actor?.login)} · ${ago(x.created_at)}</span><div class="${x.conclusion=='success'?'ok':x.conclusion=='failure'?'bad':'warn'}">${x.status=='completed'?x.conclusion:x.status}</div></div><a href="${x.html_url}" target="_blank" rel="noopener">logs ↗</a><button onclick="wf(${k},'rerun')">Rerun</button><button onclick="wf(${k},'rerun-failed-jobs')">Failed only</button><button class="dan" onclick="wf(${k},'cancel')">Cancel</button></div>`).join('')||'<div class="item dim">No workflow runs (or Actions not enabled)</div>'}</div>`},
async releases(){const r=await gh(rp()+'/releases?per_page=30');cache.r=r;$('#tb').innerHTML=`<div class="row"><button class="pri" onclick="newRel()">＋ Release</button></div><div class="list">${r.map((x,k)=>`<div class="item" style="cursor:default"><div class="g"><b>${esc(x.name||x.tag_name)}</b> <code>${esc(x.tag_name)}</code> ${x.draft?'<span class="tag">draft</span>':''}${x.prerelease?'<span class="tag warn">pre</span>':''}<div class="dim">${ago(x.published_at||x.created_at)}</div></div><a href="${x.html_url}" target="_blank" rel="noopener">↗</a><button class="dan" onclick="delRel(${k})">Delete</button></div>`).join('')||'<div class="item dim">No releases</div>'}</div>`}};
const nav=i=>{const f=cache.f[i];S.path=f.path;T.files().catch(e=>toast(e.message,1))};
function openFile(f){
  if(f.encoding!='base64'||f.size>1e6)return $('#tb').innerHTML=`<div class="card">File too large or not loadable in browser. <a href="${f.html_url}" target="_blank" rel="noopener">Open on GitHub</a></div><button onclick="S.path=S.path.split('/').slice(0,-1).join('/');T.files()">← Back</button>`;
  let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(f.content.replace(/\n/g,'')),c=>c.charCodeAt(0)))}catch{return $('#tb').innerHTML=`<div class="card">Binary file. <a href="${f.download_url}" target="_blank" rel="noopener">Download</a></div><button onclick="S.path=S.path.split('/').slice(0,-1).join('/');T.files()">← Back</button>`}
  cache.sha=f.sha;cache.orig=t;
  $('#tb').innerHTML=`<div class="row"><button onclick="S.path=S.path.split('/').slice(0,-1).join('/');T.files()">← Back</button><b>${esc(f.path)}</b><span id="dirty" class="warn"></span><span class="sp" style="flex:1"></span><button onclick="navigator.clipboard.writeText($('#ed').value);toast('Copied')">Copy</button><button onclick="dl()">Download</button></div><textarea id="ed" spellcheck="false" oninput="$('#dirty').textContent=this.value!=cache.orig?'● unsaved':''">${esc(t)}</textarea><div class="row"><input id="cm" value="Update ${esc(f.name)}"><button class="pri" onclick="save('${esc(f.path)}')">Commit to ${esc(S.branch)}</button><button class="dan" onclick="delFile('${esc(f.path)}')">Delete</button></div>`}
const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#ed').value]));a.download=S.path.split('/').pop();a.click()};
async function save(p){try{if($('#ed').value==cache.orig)return toast('No changes');
  const r=await gh(`${rp()}/contents/${p}`,{method:'PUT',body:{message:$('#cm').value||'Update '+p,content:enc($('#ed').value),sha:cache.sha,branch:S.branch}});cache.sha=r.content.sha;cache.orig=$('#ed').value;$('#dirty').textContent='';toast('Committed '+r.commit.sha.slice(0,7))}catch(e){toast(e.message,1)}}
function delFile(p){confirmD(`Delete <b>${esc(p)}</b> from <b>${esc(S.branch)}</b>? This creates a commit.`,async()=>{await gh(`${rp()}/contents/${p}`,{method:'DELETE',body:{message:'Delete '+p,sha:cache.sha,branch:S.branch}});toast('Deleted');S.path=p.split('/').slice(0,-1).join('/');T.files()})}
function newFile(){form('New file on '+S.branch,[{l:'Path',n:'p',v:S.path?S.path+'/':''},{l:'Contents',n:'c',t:'area'},{l:'Commit message',n:'m',v:'Add file'}],async v=>{
  if(!v.p||v.p.startsWith('/')||v.p.endsWith('/')||v.p.includes('..'))throw Error('Invalid path');
  await gh(`${rp()}/contents/${v.p}`,{method:'PUT',body:{message:v.m,content:enc(v.c),branch:S.branch}});toast('Created');S.path=v.p.split('/').slice(0,-1).join('/');T.files()})}
function newBranch(){form('New branch',[{l:'Source branch',n:'s',t:'select',o:cache.br.map(b=>b.name),v:S.repo.default_branch},{l:'New name',n:'n'}],async v=>{
  if(!v.n||/[\s~^:?*\[\\]|\.\.|\/$|\.lock$/.test(v.n))throw Error('Invalid branch name');
  const sha=cache.br.find(b=>b.name==v.s).commit.sha;await gh(rp()+'/git/refs',{method:'POST',body:{ref:'refs/heads/'+v.n,sha}});toast('Created '+v.n);T.branches()})}
function delBranch(i){const b=cache.br[i];if(b.name==S.repo.default_branch)return toast('Cannot delete the default branch',1);if(b.protected)return toast('Branch is protected; remove protection in GitHub settings first',1);
  confirmD(`Delete branch <b>${esc(b.name)}</b>?`,async()=>{await gh(`${rp()}/git/refs/heads/${b.name}`,{method:'DELETE'});toast('Deleted');T.branches()})}
async function cmp(b){try{const c=await gh(`${rp()}/compare/${encodeURIComponent(S.repo.default_branch)}...${encodeURIComponent(b)}`);$('#cmp').innerHTML=`<h3>${esc(b)} vs ${esc(S.repo.default_branch)}</h3><div class="card">${c.ahead_by} ahead · ${c.behind_by} behind · ${c.files.length} files changed</div>${files(c.files)}`}catch(e){toast(e.message,1)}}
const files=f=>(f||[]).map(x=>`<h3>${esc(x.filename)} <span class="tag">${x.status}</span> <span class="add">+${x.additions}</span> <span class="del">-${x.deletions}</span></h3>${x.patch?`<pre>${x.patch.split('\n').map(l=>`<div class="${l[0]=='+'?'add':l[0]=='-'?'del':''}">${esc(l)}</div>`).join('')}</pre>`:'<div class="dim">No text diff available</div>'}`).join('');
async function commit(sha){try{const c=await gh(`${rp()}/commits/${sha}`);$('#cd').innerHTML=`<h3>${esc(c.commit.message)}</h3><div class="dim">${esc(c.commit.author.name)} · ${c.sha} · +${c.stats.additions} −${c.stats.deletions} · parents: ${c.parents.map(p=>p.sha.slice(0,7)).join(', ')||'none'} <a href="${c.html_url}" target="_blank" rel="noopener">GitHub ↗</a></div>${files(c.files)}`;$('#cd').scrollIntoView()}catch(e){toast(e.message,1)}}
function newIssue(){form('New issue',[{l:'Title',n:'t'},{l:'Description (Markdown)',n:'b',t:'area'},{l:'Labels (comma separated)',n:'l'},{l:'Assignees (comma separated)',n:'a'}],async v=>{
  if(!v.t)throw Error('Title required');const i=await gh(rp()+'/issues',{method:'POST',body:{title:v.t,body:v.b,labels:v.l?v.l.split(',').map(s=>s.trim()):[],assignees:v.a?v.a.split(',').map(s=>s.trim()):[]}});toast('Created #'+i.number);T.issues()})}
async function issue(k){const i=cache.i[k];try{const c=await gh(i.comments_url);cache.ci=i;$('#id').innerHTML=`<h3>#${i.number} ${esc(i.title)} <a href="${i.html_url}" target="_blank" rel="noopener">↗</a></h3><div class="card"><pre style="white-space:pre-wrap;max-height:none">${esc(i.body||'(no description)')}</pre></div>${c.map(x=>`<div class="card" style="margin-top:8px"><div class="dim">${esc(x.user.login)} · ${ago(x.created_at)}</div>${esc(x.body)}</div>`).join('')}<textarea id="cb" style="min-height:80px;margin-top:8px" placeholder="Comment"></textarea><div class="row"><button class="pri" onclick="cmt()">Comment</button><button onclick="ist('${i.state=='open'?'closed':'open'}')">${i.state=='open'?'Close':'Reopen'}</button><button onclick="edIssue()">Edit</button></div>`;$('#id').scrollIntoView()}catch(e){toast(e.message,1)}}
async function cmt(){try{await gh(cache.ci.comments_url,{method:'POST',body:{body:$('#cb').value}});toast('Commented');issue(cache.i.indexOf(cache.ci))}catch(e){toast(e.message,1)}}
async function ist(s){try{await gh(cache.ci.url,{method:'PATCH',body:{state:s}});toast('Issue '+s);T.issues()}catch(e){toast(e.message,1)}}
function edIssue(){const i=cache.ci;form('Edit issue',[{l:'Title',n:'t',v:i.title},{l:'Body',n:'b',t:'area',v:i.body}],async v=>{await gh(i.url,{method:'PATCH',body:{title:v.t,body:v.b}});toast('Saved');T.issues()},'Save')}
function newPR(){const o=cache.br?.map(b=>b.name)||[S.repo.default_branch];form('New pull request',[{l:'Head branch',n:'h',t:'select',o,v:S.branch},{l:'Base branch',n:'b',t:'select',o,v:S.repo.default_branch},{l:'Title',n:'t'},{l:'Description',n:'d',t:'area'}],async v=>{const p=await gh(rp()+'/pulls',{method:'POST',body:{head:v.h,base:v.b,title:v.t,body:v.d}});toast('Opened #'+p.number);T.pulls()})}
async function pr(k){try{const p=await gh(cache.p[k].url),f=await gh(p.url+'/files?per_page=50');cache.cp=p;
  $('#pd').innerHTML=`<h3>#${p.number} ${esc(p.title)} <a href="${p.html_url}" target="_blank" rel="noopener">↗</a></h3><div class="card dim">${esc(p.head.ref)} → ${esc(p.base.ref)} · ${p.commits} commits · ${p.changed_files} files · mergeable: <b>${p.mergeable===null?'GitHub still computing':p.mergeable}</b> (${p.mergeable_state})</div><div class="card" style="margin-top:8px">${esc(p.body||'')}</div>${p.state=='open'?`<div class="row"><select id="mm"><option>merge</option><option>squash</option><option>rebase</option></select><button class="pri" onclick="mergePR()">Merge…</button><button class="dan" onclick="prs('closed')">Close</button></div>`:`<div class="row"><button onclick="prs('open')">Reopen</button></div>`}${files(f)}`;$('#pd').scrollIntoView()}catch(e){toast(e.message,1)}}
function mergePR(){const p=cache.cp,m=$('#mm').value;confirmD(`Merge #${p.number} into <b>${esc(p.base.ref)}</b> via <b>${m}</b>? State: ${p.mergeable_state}. Branch protection and reviews are enforced by GitHub.`,async()=>{const r=await gh(p.url+'/merge',{method:'PUT',body:{merge_method:m}});toast(r.message);T.pulls()})}
async function prs(s){try{await gh(cache.cp.url,{method:'PATCH',body:{state:s}});toast('PR '+s);T.pulls()}catch(e){toast(e.message,1)}}
async function wf(k,a){try{await gh(`${rp()}/actions/runs/${cache.w[k].id}/${a}`,{method:'POST'});toast(a+' requested');setTimeout(T.actions,1500)}catch(e){toast(e.message,1)}}
function newRel(){form('New release',[{l:'Tag',n:'t'},{l:'Title',n:'n'},{l:'Notes (Markdown)',n:'b',t:'area'},{l:'Draft',n:'d',t:'check'},{l:'Prerelease',n:'p',t:'check'},{l:'Auto-generate notes via GitHub',n:'g',t:'check'}],async v=>{
  if(!v.t)throw Error('Tag required');const r=await gh(rp()+'/releases',{method:'POST',body:{tag_name:v.t,name:v.n||v.t,body:v.b,draft:v.d,prerelease:v.p,generate_release_notes:v.g,target_commitish:S.branch}});toast('Release created');T.releases()})}
function delRel(k){const r=cache.r[k];confirmD(`Delete release <b>${esc(r.tag_name)}</b>? The git tag stays.`,async()=>{await gh(`${rp()}/releases/${r.id}`,{method:'DELETE'});toast('Deleted');T.releases()})}
async function notes(){try{const n=await gh('/notifications?per_page=40');cache.n=n;main(`<h2>Notifications</h2><div class="row"><button onclick="markAll()">Mark all read</button></div><div class="list">${n.map((x,k)=>`<div class="item"><div class="g"><b>${esc(x.subject.title)}</b><div class="dim">${esc(x.repository.full_name)} · ${x.subject.type} · ${x.reason} · ${ago(x.updated_at)}</div></div>${x.unread?'<span class="tag ok">unread</span>':''}<button onclick="rd(${k})">Read</button></div>`).join('')||'<div class="item dim">Nothing here (needs notifications scope on classic tokens; fine-grained tokens cannot read notifications)</div>'}</div>`)}catch(e){err(e)}}
async function rd(k){try{await gh('/notifications/threads/'+cache.n[k].id,{method:'PATCH'});notes()}catch(e){toast(e.message,1)}}
async function markAll(){try{await gh('/notifications',{method:'PUT',body:{}});notes()}catch(e){toast(e.message,1)}}
connect();
</script></body></html>
